# Отдельный хост: только нативный Hermes (без SPA model).
# DNS: hermes → A → 93.183.71.104 (prod live-model.ru), затем:
#   certbot --nginx -d hermes.live-model.ru
server {
    listen 80;
    listen [::]:80;
    server_name hermes.live-model.ru;

    location / {
        proxy_pass http://127.0.0.1:9119/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host 127.0.0.1:9119;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
